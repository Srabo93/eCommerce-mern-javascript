services:
  server:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/app
      JWT_SECRET: ${JWT_SECRET:-keyboardcat}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-keyboarddog}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: change-me-please
      S3_BUCKET: uploads
    ports:
      - "3000:3000"
    volumes:
      - ./packages/api/src:/app/packages/api/src:Z
    depends_on:
      - mongodb
      - minio
      - mailpit
